# Plumb behind Stile, the shared Nginx proxy (~/source/stile).
#
# Turned on from .env in this folder (copy .env.example to .env):
#
#     COMPOSE_FILE=compose.yaml:compose.nginx.yaml
#
# That .env is only for Docker Compose. Plumb's own settings and secrets stay
# in config/plumb.env, exactly as before.
#
# This file:
#   - stops publishing 6443 on the host. nginx owns that port now, and the
#     only way to reach the dashboard is through the proxy.
#   - joins plumb to the proxy's network as "plumb", which is what
#     PLUMB_UPSTREAM in stile/.env points at.
#
# `ports: !reset []` needs Docker Compose 2.24.4 or later (docker compose version).
#
# Start Stile first; it owns the network this file joins. On an existing
# install, `docker compose up -d` here frees 6443 before the proxy needs it.
#
# Back to direct access: comment out COMPOSE_FILE in .env, then `docker compose up -d`.

services:
  plumb:
    ports: !reset []
    networks:
      default:
      stile_net:
        aliases: [plumb]

networks:
  stile_net:
    external: true
    name: ${STILE_NETWORK:-stile_net}
